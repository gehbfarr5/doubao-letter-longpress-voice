plugins {
    id "com.android.application"
}

android {
    namespace "com.jin.doubaolongpressvoice"
    compileSdk 36
    ndkVersion "29.0.13846066"

    defaultConfig {
        applicationId "com.jin.doubaolongpressvoice"
        minSdk 23
        targetSdk 36
        versionCode 15
        versionName "1.6.7"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-23"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        ndkBuild {
            path file("src/main/cpp/Android.mk")
        }
    }
}

dependencies {
    // Xposed / LSPosed API. compileOnly so it is NOT bundled into the APK
    // (the runtime provides it).
    compileOnly files("libs/api-82.jar")
    testImplementation "junit:junit:4.13.2"
}
